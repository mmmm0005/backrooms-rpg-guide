for(const info of [...data.sectionLevels].sort(compareLayers)){const option=document.createElement('option');option.value=info.id;option.textContent=visible(info.label);level.append(option);}

for(const info of data.sharedPools||[]){const option=document.createElement('option');option.value=info.id;option.textContent=info.label+' · '+info.rootEvents+'事件 / '+info.cards+'卡';level.append(option);}
const params=new URLSearchParams(location.search);
if(Array.from(level.options).some(l=>l.value===params.get('level')))level.value=params.get('level');
if(params.has('q'))q.value=params.get('q');
const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=visible(playerText(text));return node;};
function row(label,text){const line=el('div','detail-row');line.append(el('span','detail-label',label),el('span','outcome',text));return line;}
function focusEntry(uid){const target=allCards.find(e=>e.uid===uid);if(!target){const href=data.supplementLinks?.[uid]||data.sectionLinks?.[uid];if(href)location.assign(href);return;}view=target.kind==='委托流程'?'quests':target.kind==='敌人弱抗'?'enemies':'events';level.value=Array.from(level.options).some(o=>o.value===target.level)?target.level:'';kind.value=view==='events'?target.kind:'';q.value=visible(target.title);limit=40;render(false,uid);const node=Array.from(cards.children).find(n=>n.dataset.uid===uid);if(node){node.tabIndex=-1;node.focus();node.scrollIntoView({behavior:'smooth',block:'start'});}}
function makeCard(e){
 const card=el('article',e.details?'card combat-card':'card');card.dataset.uid=e.uid;
 const meta=el('div','meta');const info=visibleLevels.find(l=>l.id===e.level)||enemyLevels.find(l=>l.id===e.level)||(data.sharedPools||[]).find(l=>l.id===e.level)||{};meta.append(el('span','',e.scopeLabel||(info.series?info.series+' · '+info.label:info.label)),el('span','kind',e.kind));card.append(meta,el('h2','',e.title));
 if(e.sign)card.append(el('p','sign',e.sign));
 const advice=el('div','advice');advice.append(el('span','advice-label',view==='events'?'条件推荐 · '+['顺路推进','补给养成','激进采集'][goal]:view==='quests'?'委托目标':'弱点／抗性摘要'),el('span','',e.advice[goal]||e.advice[0]));card.append(advice);
 if(e.flow?.length){const flow=el('ol','split-list');for(const step of e.flow){const item=el('li');item.append(el('strong','',step.label),el('p','',step.text));if(step.recommendation)item.append(el('p','advice',step.recommendation));if(step.choices?.length){const choices=el('details');choices.append(el('summary','','展开全部执行按钮、消耗与失败结果'));for(const choice of step.choices)choices.append(el('p','requires',choice));item.append(choices);}for(const ref of step.related||[]){const button=el('button','branch-link',ref.title);button.type='button';button.addEventListener('click',()=>focusEntry(ref.uid));item.append(button);}flow.append(item);}card.append(flow);}
 if(e.destinationLink){const dest=el('a','','查看目的层事件与出口');dest.href=e.destinationLink;card.append(dest);}
 if(e.kind!=='敌人弱抗'&&playerText(e.risk))card.append(el('p','risk','留意：'+e.risk));
 if((e.branches||[]).length){const list=el('ul','split-list');data.entries.filter(child=>child.parent===e.uid).forEach(child=>{const item=el('li');const button=el('button','branch-link',child.title);button.type='button';button.addEventListener('click',()=>focusEntry(child.uid));item.append(button);list.append(item);});card.append(list);}
 const list=el('ol','option-list');branchOptions(e).forEach(o=>{const item=el('li');item.append(el('span','ordinal','选项'),el('span','',o.text));if(o.requirement!=='—')item.append(el('span','requires','需 '+o.requirement));list.append(item);});if(e.options.length)card.append(list);
 if(data.routeLinks?.[e.uid]?.length){const links=el('div','links');for(const link of data.routeLinks[e.uid]){const button=el('button','branch-link',link.title);button.type='button';button.addEventListener('click',()=>focusEntry(link.uid));links.append(button);}card.append(links);}
 if(e.related?.length){const links=el('div','links');for(const link of e.related){const button=el('button','branch-link',link.title);button.type='button';button.addEventListener('click',()=>focusEntry(link.uid));links.append(button);}card.append(links);}
 const details=el('details','details');details.append(el('summary','',e.kind==='探索入口'?'入口条件与分支':e.kind==='委托流程'?'交付奖励与条件':e.kind==='敌人弱抗'?'各层数值与战术':e.details?'遭遇、战术与数值':'前提、检定与风险'));playerDetails(e).forEach(d=>details.append(row(d.label,d.text)));(e.combatReferences||[]).forEach(r=>{details.append(row('关联战斗',r.text));if(r.entryEffects)details.append(row('该入口显式效果',r.entryEffects));if(r.aftermath?.length){details.append(row('该入口战后分支','仅进入实际结局对应的一栏'));r.aftermath.forEach(a=>details.append(row('战后 '+a.label,a.text)));}});if(e.text)details.append(el('p','intro',e.text));
 branchOptions(e).forEach(o=>{const item=el('div','option-detail');item.append(el('h3','',o.text),row('前提',o.requirement),row('基础',o.check),row('成功',o.success),row('失败',o.failure));(o.alternatives||[]).forEach(a=>item.append(row(a.label,a.text)));item.append(row('标记',o.flags));details.append(item);});
 card.append(details);
 return card;
}


// layer-select-labels-v2
function refreshLayerLabels(){
 for(const option of level.options){
  if(!option.value){option.textContent=view==='events'?`全部 ${visibleLevels.length} 层`:`全部关联层级（${data.sectionLevels?.length||0}）`;continue;}
  const info=visibleLevels.find(row=>row.id===option.value),pool=(data.sharedPools||[]).find(row=>row.id===option.value);
  if(info)option.textContent=visible(view==='events'?layerOptionLabel(info):info.label);
  else if(pool)option.textContent=visible(pool.label+' · '+pool.cards+'卡');
 }
}
const layerQuery=root.querySelector('#layer-search'),layerResults=root.querySelector('#layer-search-results'),layerStatus=root.querySelector('#layer-search-status');
// Finding a roster entry alone never changes the content filters.
const layerRoster=mergeLayerRoster([...(data.section==='events'?data.levels:(data.sectionLevels||data.levels)),...((data.section==='events'||!data.section)?(data.supplementalLevels||[]):[])]).map(info=>({...info,number:info.id.replace(/^Level/,'').replace(/_/g,'.')}));
let foundLayers=[];
function findLayers(){
 const raw=layerQuery.value.normalize('NFKC').trim().toLowerCase(),key=layerAliasKey(raw);
 if(!raw)return [];
 const numeric=raw.match(/^(?:level|l|层级|层)?\s*(\d+(?:[._]\d+)?)(?:\s*层)?$/u)?.[1]?.replace('_','.');
 const tokens=raw.split(/\s+/u).map(normalize).filter(Boolean);
 const exact=info=>layerAliases(info).some(alias=>layerAliasKey(alias)===key);
 const literalHits=layerRoster.filter(exact);
 if(/[!?]/u.test(raw)&&literalHits.length)return literalHits.sort(compareLayers);
 if(!tokens.length)return literalHits.sort(compareLayers);
 return layerRoster.filter(info=>numeric?info.number.startsWith(numeric):tokens.every(token=>layerAliases(info).some(field=>normalize(field).includes(token))))
 .map((info,index)=>({info,index,exact:numeric?info.number===numeric:exact(info)}))
 .sort((a,b)=>Number(b.exact)-Number(a.exact)||compareLayers(a.info,b.info)||a.index-b.index).map(row=>row.info);
}
function chooseFoundLayer(id){
 level.value=id;q.value='';kind.value='';layerQuery.value='';render(true);layerQuery.focus();
}
function renderLayerFinder(){
 foundLayers=findLayers();layerResults.hidden=!layerQuery.value.trim();
 layerResults.replaceChildren(...foundLayers.map((info,index)=>{
  const button=el('button','',visible(info.label));button.type='button';button.dataset.layer=info.id;button.setAttribute('aria-pressed',String(level.value===info.id));button.addEventListener('click',()=>chooseFoundLayer(info.id));
  button.addEventListener('keydown',event=>{
   if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseFoundLayer(info.id);}
   if(event.key==='ArrowDown'){event.preventDefault();layerResults.children[index+1]?.focus();}
   if(event.key==='ArrowUp'){event.preventDefault();(layerResults.children[index-1]||layerQuery).focus();}
   if(event.key==='Escape'){event.preventDefault();layerQuery.value='';renderLayerFinder();layerQuery.focus();}
  });return button;
 }));
 const selected=layerRoster.find(info=>info.id===level.value);
 layerStatus.textContent=layerQuery.value.trim()?(foundLayers.length?`找到 ${foundLayers.length} 个层级 · 点名称查看，清空内容关键词与类别筛选。`:'没有找到当前目录中的层级；可换编号或名称。未列出不代表游戏中不存在。'):(selected?'当前：'+visible(selected.label)+' · 可输入编号或名称换层。':'输入编号、名称或特殊标题（!、13?、LX），简繁均可；选中后显示该层'+(view==='events'?'事件。':'关联资料。'));
}
layerQuery.addEventListener('input',renderLayerFinder);
layerQuery.addEventListener('keydown',event=>{
 if(event.key==='Escape'){event.preventDefault();layerQuery.value='';renderLayerFinder();}
 if(event.key==='Enter'){event.preventDefault();if(foundLayers.length===1)chooseFoundLayer(foundLayers[0].id);else layerResults.children[0]?.focus();}
 if(event.key==='ArrowDown'){event.preventDefault();layerResults.children[0]?.focus();}
});
root.querySelector('#layer-search-clear').addEventListener('click',()=>{layerQuery.value='';renderLayerFinder();layerQuery.focus();});
root.querySelector('#layer-show-all').addEventListener('click',()=>{level.value='';q.value='';kind.value='';layerQuery.value='';render(true);layerQuery.focus();});

function render(reset=false,focusUid=''){
 refreshLayerLabels();
 renderLayerFinder();
 if(reset)limit=40;
 const tokens=q.value.trim().split(/\s+/u).map(normalize).filter(Boolean);
 matches=atlas[view].filter(e=>matchesEventLayer(e,level.value)&&(!kind.value||e.kind===kind.value)&&tokens.every(token=>searchFields.get(e.uid).some(field=>fieldMatches(field,token))));
 if(tokens.length)matches=matches.map((e,i)=>({e,i,score:tokens.reduce((sum,token)=>sum+searchFields.get(e.uid).reduce((best,field,index)=>Math.max(best,fieldMatches(field,token)?(index<4?8:1):0),0),0)})).sort((a,b)=>b.score-a.score||a.i-b.i).map(x=>x.e);
 if(view==='events'&&level.value&&!tokens.length)matches=[...matches.filter(e=>e.level===level.value),...matches.filter(e=>e.level!==level.value)];
 if(focusUid){const index=matches.findIndex(e=>e.uid===focusUid);if(index>0)matches.unshift(...matches.splice(index,1));}
 cards.replaceChildren(...matches.slice(0,limit).map(makeCard));
 empty.hidden=matches.length>0;more.hidden=matches.length<=limit;
 for(const option of level.options)if(option.dataset.enemyOnly)option.hidden=view!=='enemies';
 kind.disabled=view!=='events';
 lookupNote.hidden=view==='events';lookupNote.textContent=visible(view==='quests'?data.questBoundary:data.enemyBoundary);
 root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
 status.textContent=`匹配 ${matches.length} 条 · 已显示 ${Math.min(limit,matches.length)} 条`;
 const info=visibleLevels.find(l=>l.id===level.value),pool=(data.sharedPools||[]).find(p=>p.id===level.value);route.hidden=!(info?.routeAdvice||pool?.scope);if(pool?.scope)route.textContent=visible(pool.scope);else if(info?.routeAdvice)route.textContent=visible('本层路线取舍：'+info.routeAdvice);
 route.hidden=true;root.querySelectorAll('[data-goal]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.goal)===goal)));
}
root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;if(view!=='enemies'&&level.selectedOptions[0]?.dataset.enemyOnly)level.value='';kind.value='';q.value='';render(true);}));
display.addEventListener('change',()=>render());
q.addEventListener('input',()=>render(true));level.addEventListener('change',()=>render(true));kind.addEventListener('change',()=>render(true));
root.querySelector('#clear').addEventListener('click',()=>{q.value='';render(true);q.focus();});
root.querySelectorAll('[data-goal]').forEach(b=>b.addEventListener('click',()=>{goal=Number(b.dataset.goal);render();}));
more.addEventListener('click',()=>{limit+=40;render();});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){event.preventDefault();q.focus();}if(event.key==='Escape'&&document.activeElement===q){q.value='';render(true);}});
const requested=params.get('uid');if(requested&&(allCards.some(e=>e.uid===requested)||data.sectionLinks?.[requested]||data.supplementLinks?.[requested]))focusEntry(requested);else render();
})();
</script>
