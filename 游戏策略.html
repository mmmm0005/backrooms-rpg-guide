<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后室RPG · 游戏策略</title>
<link rel="stylesheet" href="攻略站样式.css">
<style>
.strategy-main{max-width:900px;margin:0 auto;padding:32px 24px 72px}
.strategy-nav{display:flex;flex-wrap:wrap;gap:8px 16px;margin:20px 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.strategy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}
.strategy-card{display:block;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-decoration:none;box-shadow:var(--shadow)}
.strategy-card h2{margin:0 0 7px;font-size:19px}.strategy-card p{margin:0;color:var(--muted)}
@media(max-width:700px){.strategy-main{padding:20px 14px 48px}.strategy-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="strategy-main">
  <div class="eyebrow">后室RPG攻略</div>
  <h1>游戏策略</h1>
  <p class="subtitle">面向玩家的策略入口。这里目前保留结局速查；事件、怪物、物品和角色资料分别在其他页面整理。</p>
  <nav class="strategy-nav" aria-label="攻略页面导航">
    <a href="index.html">事件速查</a>
    <a href="结局速查.html">结局速查</a>
    <a href="角色分类.html">角色分类</a>
    <a href="物品用途速查.html">物品用途</a>
    <a href="提示术语.html">探索提示</a>
  </nav>
  <section class="strategy-grid" aria-label="游戏策略页面">
    <a class="strategy-card" href="结局速查.html">
      <h2>结局速查</h2>
      <p>按层级、结局入口和条件查找可达结局、检定要求、分支结果与附加碎片。</p>
    </a>
  </section>
  <footer class="site-footer">
    <p>这是玩家整理的非官方资料，仅保留公开版玩家查阅内容。</p>
    <p><a href="index.html">回到速查首页</a></p>
  </footer>
</main>
</body>
</html>
